[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # Netlify uses Corepack and the packageManager version in package.json.
  PNPM_FLAGS = "--frozen-lockfile"

[[redirects]]
  from = "https://www.referralupdate.com/*"
  to = "https://referralupdate.com/:splat"
  status = 301
  force = true
